[build-system]
# keep in sync with dependency-groups
requires = [
    "meson-python>=0.18.0",
    "Cython>=3.1.1",
    "numpy>=2.0.0",
]
build-backend = "mesonpy"

[project]
name = "ewah_bool_utils"
version = "1.3.0"
description = "EWAH Bool Array utils for yt"
authors = [
  { name = "Matthew Turk" },
  { name = "Meagan Lang" },
  { name = "Navaneeth Suresh" },
]
requires-python =">=3.11"
dependencies = [
  # match the absolute oldest version of numpy with *any*
  # level of support for our minimal Python requirement
  "numpy>=1.23.2, <3",
]
license = "Apache-2.0 AND BSD-2-Clause"
license-files = [
    "LICENSE",
    "src/ewah_bool_utils/cpp/LICENSE",
]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 1 - Unstable"
]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/yt-project/ewah_bool_utils"

[dependency-groups]
dev = [
    "cython>=3.1.1",
    "meson-python>=0.18.0",
    "ninja>=1.11.1.3",
    "numpy>=2.0.0",
]
test = [
    "pytest>=9.0.0",
]

[tool.meson-python]
# disallow limited-api builds by default
# - users building from source generally do not need portable binaries
# - this is overridden in the cibuildwheel section
limited-api = true
args.setup = ['-Dpython.allow_limited_api=false']

[tool.uv]
no-build-isolation-package = ["ewah-bool-utils"]
no-build-package = [
    "numpy",
]

constraint-dependencies = [
    "meson>=1.5",
]

[tool.ruff.lint]
exclude = ["*__init__.py"]
ignore = ["E501"]
select = [
    "E",
    "F",
    "W",
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "YTT", # flake8-2020
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["ewah_bool_utils"]

[tool.pytest]
minversion = "9.0"
strict = true
addopts = ["-ra"]
filterwarnings = [
    "error",
]

[tool.cibuildwheel]
skip = ["cp314t-*"]
build-frontend = "uv; args: -Csetup-args='-Dpython.allow_limited_api=true' --no-config"
build-verbosity = 1
test-groups = ["test"]
test-sources = ["tests", "pyproject.toml"]
test-command = [
    "python -m pytest --color=yes tests",
]

[tool.cibuildwheel.windows]
# adapted from numpy
config-settings = {setup-args = ["--vsenv"], build-dir="build"}
